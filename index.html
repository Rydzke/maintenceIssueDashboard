<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>MID (maintence issue dashboard)</title>
</head>
<body>
    <header>
        <div><img src="./img/hotel.svg" alt="hotel logo"></div>
    </header>
    <main>
        <section>
            <form id="addIssue">
                <label for="apartament">apartament</label>
                <select name="apartament" id="apartament">
                    <!-- list All apartament -->
                </select>
                <label for="category">category</label>
                <select name="category" id="category">
                    <option value="other">other</option>
                </select>
                <label for="description">description</label>
                <textarea name="description" id="description"></textarea>
                <label for="prioritty"></label>
                <select name="prioritty" id="prioritty">
                    <option value="pending">Pending</option>
                    <option value="inProgress">In progress</option>
                    <option value="resolved">resolved</option>
                </select>
                <button type="submit" name="add"><img src="img/add.svg" alt="add"></button>
            </form>
        </section>
        <section>
            <!-- list -->
             <h2>Issue List</h2>
             <table id="issueList">
                <tr>
                    <th>ID</th>
                    <th>Apartament ID</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Add Date</th>
                    <th>Solved Date</th>
                    <th>Priority</th>
                    <th>Status</th>
                </tr>
             </table>
        </section>
        <script src="./issueListDisplay.js"></script>
    </main>
</body>
</html>
