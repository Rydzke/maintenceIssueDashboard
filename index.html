<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="./img/hotel.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>MID (maintence issue dashboard)</title>
</head>
<body>
    <header>
        <div><img src="./img/hotel.svg" alt="hotel logo"></div>
    </header>
    <main>
        <section>
            <h1>Add new issue</h1>
            <form id="addIssue">
                <label for="idApartament">apartament</label>
                <select name="idApartament" id="idApartament">
                    <option value="1">Boss</option>
                </select>
                <label for="category">category</label>
                <select name="category" id="category">
                    <option value="other">other</option>
                </select>
                <label for="description">description</label>
                <textarea name="description" id="description"></textarea>
                <label for="priority">Priority</label>
                <select name="priority" id="priority">
                    <option value="low">low</option>
                    <option value="mediium">medium</option>
                    <option value="high">high</option>
                </select>
                <label for="status">Status</label>
                <select name="status" id="status">
                    <option value="pending">Pending</option>
                    <option value="inProgress">In progress</option>
                    <option value="resolved">resolved</option>
                </select>
                <button type="submit" name="add"><img src="img/add.svg" alt="add"></button>
            </form>
        </section>
        <section>
            <!-- list -->
             <h1>Issue List</h1>
             <table id="issueList">
                <tr>
                    <th>ID</th>
                    <th>Apartament ID</th>
                    <!-- <th>Apartament Name</th> -->
                    <th>Category</th>
                    <th>Description</th>
                    <!-- <th>Location</th> -->
                    <th>Add Date</th>
                    <th>Solved Date</th>
                    <th>Priority</th>
                    <th>Status</th>
                </tr>
             </table>
        </section>
        <script src="./main.js"></script>

    </main>
</body>
</html>
